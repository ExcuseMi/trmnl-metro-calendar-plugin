<style>
  /* Ink and paper only. Spacing and centring come from the framework's own
     utility classes on the element instead, because the inline-style lint
     counts a handful of property names by scanning the raw markup for them,
     comments included, against a budget of six for the whole template.
     Naming one here costs the same as using it. */
  .metro-banner {
    background: var(--framework-semantic-text-primary-text-color, #000);
    color: var(--framework-semantic-canvas-bg-color, #fff);
  }
  .metro-canvas { overflow: hidden; }
  /* THE BOARD'S OWN INK, AND ONLY THE INK.
     Text SIZE is not here: the board's words wear the framework's own label
     classes, which size themselves from the screen's scale, so an X panel
     gets bigger text than an OG without this file knowing the difference --
     and the ruler in measure-dom.js measures the same class it will be
     drawn in, which is what makes the measurement and the drawing agree.
     What is left is stroke and fill, which the framework has no class for. */
  .metro-svg text { fill: #000; }
  .metro-svg .rail, .metro-svg .spur { fill: none; stroke: #000; stroke-linecap: round; stroke-linejoin: round; }
  .metro-svg .bar, .metro-svg .tick { stroke: #000; stroke-linecap: round; }
  .metro-svg .dot { fill: #fff; stroke: #000; }
  .metro-svg .pill { fill: none; stroke: #000; stroke-width: 3; }
  .metro-svg .badge { fill: #fff; stroke: #000; stroke-width: 1.5; }
  /* the drawing surface fills its container; kept here rather than inline so
     the markup carries no style attribute of its own */
  .metro-svg { overflow: visible; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  /* No box behind a label — an opaque panel over a metro map reads as a
     hole punched in it, and on a busy board those holes are most of the
     picture. The text carries its own thin paper outline instead: it stays
     legible where a line runs under it, and where nothing does there is
     nothing to see. paint-order puts the stroke BEHIND the glyphs, so the
     letterforms keep their real weight instead of being thinned by a
     centred stroke. */
  .metro-label, .metro-terminus, .metro-hour, .metro-axis-note, .metro-sky {
    paint-order: stroke fill;
    -webkit-text-stroke: 3px var(--framework-semantic-canvas-bg-color, #fff);
  }
  /* A CAPTION IS ONE THING, NOT A STACK OF ROWS.
     The time and the title are two lines of the same name, so they are set
     as tight as two lines can be set: at 1.2 the gap between them read as
     the gap between two captions, which on a board where a dozen names lean
     past each other is exactly the wrong thing for it to read as. Tighter
     also makes every label thinner, and a label's thickness is what the
     lane ladder is built out of. */
  .metro-label { line-height: 1.05; }
  .metro-hour, .metro-axis-note { white-space: nowrap; }
  /* A SECOND DAY COSTS THE ROW WHAT THE CONDITION WAS SPENDING.
     The header is one row and its height comes off the map, so a two-day
     header that wraps has taken a band of canvas to say something the
     board was already saying. The condition text is the first thing to go,
     the same way it goes when the header is squeezed: "Rain - 80% rain"
     twice over is most of the width and the numbers beside it carry the
     day anyway. Kept where there is genuinely room, which is the large
     header on a panel like the X. */
  /* A row of days is a legend for the axis below it, so it starts where the
     axis starts rather than being centred over the panel. The header is a
     column that centres what it holds, and a row shrink-wrapped to its own
     words cannot line up with anything: it takes the full width first, and
     then its contents are free to sit where the axis puts them. */
  /* A DAY'S NAME OVER ITS OWN STRETCH OF AXIS, as far as that can be had.
     Their WIDTHS cannot be the day's width -- an evening is a third of the
     axis and "Thu 10 Sep 21/13 Rain - 80% rain" does not fit a third of an
     800px panel at any size worth reading -- and their STARTS cannot be
     the day's start either: measured on a real board, aligning them meant
     deleting today's forecast to make room, which is trading information
     for tidiness the wrong way round.
     What is left is worth having on its own. The row spans the map rather
     than floating centred over it, and the days sit along it in the order
     the map draws them, first at the leading edge and last at the trailing
     one. The date marker on the strip still says exactly where the day
     turns over; this says which days are on the board and what the weather
     does on each. */
  /* The spacer between two days carries `grow`, so with nothing else said
     it takes all the slack and the last day sits at the trailing edge --
     which is where it belongs when the alignment below cannot reach. Where
     it can, the client gives that spacer an exact width instead, and
     space-between would have gone on redistributing the slack around it. */
  /* ...and the header itself, which is shrink-wrapped and centred over the
     panel like everything else in that column. A band 639px wide over a
     780px map cannot be a legend for it whatever its contents do. */
  /* Which day of a week-long holiday this is goes the way the condition
     and the alert lines go when the header is squeezed: it is an
     explanation, and the NAME of the day is what has to survive. */
  /* the alert lines are the first thing to go when the header is squeezed:
     they are an explanation, and a squeezed header has no room to explain */
  /* A tiny view (a quadrant, a half-horizontal on an OG panel) already
     hides the date and the weather for want of room, which leaves a band of
     paper carrying the mark and the word "Today" and nothing else. On a
     quadrant that band is a third of the board. The hour scale underneath
     says which day this is by saying what time it is, so the header goes
     and the map gets the height. */
  .metro-wicon { width: 28px; height: 28px; }
  .metro-mark { width: 30px; height: 30px; }
  /* Concentric rings, sized to sit on the date's own line rather than to
     be a mark in its own right: this one is punctuation in front of a
     name, not a station on a map. */
  .metro-holiday-ring { width: 14px; height: 14px; }
  /* A NAME TOO LONG FOR THE BADGE IS DROPPED, NOT CUT.
     This was a third of the row at most, with the overflow clipped: the
     holiday sat in a header band the width of the board, where a third of it
     was generous and cutting a long name was better than pushing the weather
     onto a second line and taking 85px of canvas with it.
     The badge is not a row. It is shrink-wrapped and absolutely placed, so a
     percentage resolves against something much smaller and "Boxing Day" came
     out as "Boxing Da". It does not need the clamp either: the badge is
     measured before it is drawn and gives way in a stated order when it will
     not fit its stretch of axis (see dayBadge), so a name too long to fit
     costs the badge its ordinal, then its forecast, then the name -- each of
     them whole. Nothing on the strip is ever half a word.
     Neither wraps: a badge is one row, and the row's depth is the map's. */
  .metro-holiday { min-width: 0; }
  .metro-holiday-name, .metro-holiday-day { white-space: nowrap; }
  /* A solid ink badge with the text knocked out of it. On e-ink this is the
     highest-contrast mark available, and it gives the header two fixed
     anchors — what day it is, and how much of it is on screen — that read at
     a glance from across a room instead of as grey annotations. */
  .metro-pill {
    display: inline-block; white-space: nowrap;
    padding: 2px 10px; border-radius: 999px;
    /* one declaration for both pills: the linter counts property NAMES in
       the markup, and every extra one is spend against a small budget */
    background: var(--framework-semantic-text-primary-text-color, #000);
    color: var(--framework-semantic-canvas-bg-color, #fff);
    line-height: 1.35;
  }
  .metro-pill--quiet {
    background: transparent;
    color: var(--framework-semantic-text-primary-text-color, #000);
    box-shadow: inset 0 0 0 2px var(--framework-semantic-text-primary-text-color, #000);
  }
  .metro-terminus { white-space: nowrap; }
  /* A date marker on the hour strip is set in capitals, so that a name
     among numbers reads as a different KIND of thing at a glance rather
     than as another tick with letters in it. It is the same size as the
     hours: bigger, it would be the loudest thing on a strip whose job is
     the clock. */
  .metro-daybreak { text-transform: uppercase; letter-spacing: 0.04em; }
  .metro-sky { white-space: nowrap; }
  .metro-hour, .metro-axis-note, .metro-terminus, .metro-sky { padding: 1px 3px; }
  /* nothing above or below: see the line-height note. Either side is the
     paper the words sit on and stays. */
  .metro-label { padding: 0 3px; }
  /* Ink mixed toward the canvas: a grey in either theme, at full opacity so
     the paper outline behind the glyphs stays solid. Where color-mix is not
     understood the declaration is dropped and the text is simply full ink,
     which is legible either way round. */
  .metro-quiet { color: color-mix(in srgb, var(--framework-semantic-text-primary-text-color, #000) 68%, var(--framework-semantic-canvas-bg-color, #fff)); }
  /* the badge is its own background, so it wants no paper outline: white
     text with a white outline behind it is a white blob */
  .metro-axis-note.metro-pill { padding: 1px 9px; -webkit-text-stroke: 0; }
</style>

<script>
(function () {
  // ON `window`, AND THEN ALIASED, so the minifier cannot rename it. A
  // property name is not an identifier: `window.METRO` survives the mangler
  // untouched, which is what lets the layout suite swap a fixture into the
  // artefact that actually ships and measure THAT rather than the source.
  window.METRO = {"secondary_threshold_min":30,"date_label":"Mon 14 Sep","now_min":495,"orientation":"auto","hour12":false,"i18n":{"today":"Today","more":"+{n} more","earlier":"+{n} earlier","rain_pct":"{n}% rain"},"header_weather":null,"legend":[{"key":"a","name":"Ann","side":"left","hue":"black","track_offset":0,"line_width":3,"line_style":"solid"},{"key":"b","name":"Ben","side":"left","hue":"black","track_offset":0,"line_width":3,"line_style":"solid"}],"all_day":[],"events":[{"type":"event","title":"School Run","start_min":480,"end_min":510,"owner":"b","co_owners":["a"],"side":"left","hue":"black","track_width":3,"track_style":"solid","track_offset":0}],"weather":[],"day_start_min":420,"day_end_min":1320,"window_label":"07:00 22:00","days":[{"index":0,"start_min":0,"end_min":1440,"date_label":"Mon 14 Sep","weekday_label":"Monday","weather":null}]};
  var METRO = window.METRO;
  var SCRIPT = document.currentScript;
  var ROOT = SCRIPT && SCRIPT.parentElement ? SCRIPT.parentElement : document;
  var canvas = ROOT.querySelector('.metro-canvas');
  var svg = ROOT.querySelector('.metro-svg');
  if (!canvas || !svg) return;

/* ---- solver bundle: generated from solver/ by plugin/bundle.js ---- */
// Do not edit here. Edit solver/*.js and run `node plugin/bundle.js`.
var SOLVER = (function () {
  var MODS = {};
  function require(n) { return MODS[n.replace(/^\.\//, "")]; }
  MODS["board"] = (function () {
    var module = { exports: {} }; var exports = module.exports;

// A BOARD IS DATA, AND THAT IS THE WHOLE POINT OF THIS FILE.
//
// The board the plugin draws today does not exist anywhere as a value. It is
// smeared across DOM boxes, `_`-prefixed fields hung on event objects, and a
// drawing pass that recomputes geometry a fifth time on its way out. Three
// consequences, and all three are why this has been fix-one-break-three:
//
//   1. NOTHING CAN BE CHECKED WITHOUT A BROWSER. Asking "do two captions
//      overlap" means building the plugin, launching Chromium, rendering and
//      reading the DOM back. Four minutes a run. At that price you change
//      three things before you measure, and then you cannot say which one
//      did what.
//   2. A PART OF THE BOARD CAN BE MISSING AND NOTHING SAYS SO. Five captions
//      are currently measured as zero width and placed as if they were
//      points, while drawing a hundred pixels wide. A caption with no size
//      collides with nothing, so every pass downstream is reasoning about a
//      board that is not the one on the panel.
//   3. THE SOLVER CANNOT SEE MOST OF IT. The band solver is handed counts,
//      not boxes, so it sizes the paper without knowing what goes on it.
//
// So: one structure that holds everything the panel shows, in pixels, with
// nothing implied and nothing derived at read time. It is produced by the
// solver, printed by `ascii`, checked by `check`, and only then drawn. If it
// cannot be printed as text it is not finished, and if `check` is clean the
// board is correct by construction rather than by a suite agreeing.
//
// COORDINATES. One convention, everywhere, and it is not x/y: `a` runs ALONG
// the time axis and `c` runs ACROSS it. On a landscape board a is x and c is
// y; standing up they swap. Every quantity in here is pixels in (a, c), and
// the one place that knows about x and y is the renderer. Mixing the two up
// is the single most common bug in the code this replaces, so the names do
// not permit it.

// ---------------------------------------------------------------- the model

// A caption. `w` and `h` are the MEASURED size of the words: a caption may
// not exist without them, which is the bug in (2) above made unrepresentable.
function Caption(spec) {
  if (!(spec.w > 0) || !(spec.h > 0)) {
    throw new Error('caption "' + spec.text + '" has no size (w=' + spec.w
      + ', h=' + spec.h + '); measure before placing');
  }
  this.id = spec.id;
  this.of = spec.of || null;        // the event it names
  // THE MINUTE IT IS ABOUT. Not used by the solver -- a caption is placed by
  // where its words fit, and the mark is already in `stops` -- but the drawing
  // needs it to run a leader from the mark to the words, and working it back
  // out from the stop list is exactly the kind of rederivation this model
  // exists to stop.
  this.at = spec.at == null ? null : spec.at;
  this.text = spec.text || '';
  this.a = spec.a;                  // near edge along the axis
  this.c = spec.c;                  // near edge across it
  this.w = spec.w;                  // extent along the axis
  this.h = spec.h;                  // extent across it
  this.line = spec.line || null;    // the track it belongs to, for pairing
  this.rows = spec.rows || [this.text];  // the lines of words, as drawn
  this.size = spec.size || 1;
  // The framework class each row is drawn in, so the drawing wears exactly
  // what the ruler measured.
  this.rowCls = spec.rowCls || null;
  this.el = spec.el || null;
}
Caption.prototype.box = function () {
  return { a0: this.a, a1: this.a + this.w, c0: this.c, c1: this.c + this.h };
};

// A track's rail, as the polyline it is actually drawn as. Not a baseline
// plus a list of exceptions: the points are the drawing, so anything that
// asks where a line is at a minute gets the answer the panel shows.
function Line(spec) {
  this.key = spec.key;
  this.pts = spec.pts || [];        // [[a, c], ...] in axis order
  this.width = spec.width || 2;
  // Set when this is a SPUR rather than a trunk: the owner's key. Dropped on
  // the floor once, and it mattered -- every branch was counted as a trunk,
  // so each collected the reward meant for a trunk changing level and none
  // ever paid the price of being a second rail. The search reached for a
  // branch where a step would have done, which is exactly what it was being
  // told not to do.
  this.branchOf = spec.branchOf || null;
  // Drawn in another line's ink: a tie's spur leaves the outermost line in
  // the tie but belongs to the event's owner.
  this.ink = spec.ink || null;
  // solid | dashed | dotted -- the only thing that tells two rails apart on
  // a panel with no colour.
  this.style = spec.style || 'solid';
}
// THE BOX THIS LINE LIVES IN, worked out once.
//
// Most questions asked of a line are "are you anywhere near this caption",
// and for most lines on most boards the answer is no. Answering that by
// sampling the polyline fifty times is the single most expensive thing the
// solver does: a band search prices a thousand allocations, each of which
// asks every caption about every line, and almost all of it is spent proving
// that a rail two bands away is two bands away.
Line.prototype.bounds = function () {
  if (this._b) return this._b;
  var p = this.pts, lo = Infinity, hi = -Infinity;
  for (var i = 0; i < p.length; i++) {
    if (p[i][1] < lo) lo = p[i][1];
    if (p[i][1] > hi) hi = p[i][1];
  }
  this._b = { a0: p.length ? p[0][0] : 0, a1: p.length ? p[p.length - 1][0] : 0,
              c0: lo, c1: hi };
  return this._b;
};
// Could this line possibly be inside that box? Cheap, and only ever says
// "no" when it is certain.
//
// SEGMENT BY SEGMENT, OVER THE STRETCH THE BOX OCCUPIES. The whole line's
// extent is the cheap test and it is the only one this used to do -- which
// was fine while every rail stayed in its own band. Once a rail dives across
// the board to an interchange and back, its overall extent is most of the
// panel and a filter built on it stops filtering: every caption then samples
// every rail, which is most of what the solver spends its time on.
//
// The global box is still asked FIRST, because it is memoised and answers no
// for most pairs in a few instructions. What follows only runs for the ones
// it cannot dismiss, and it exits at the first segment that really is in the
// box rather than measuring the rest.
Line.prototype.near = function (box) {
  var p = this.pts, n = p.length;
  if (n < 2) return false;
  if (box.a1 < p[0][0] || box.a0 > p[n - 1][0]) return false;
  var b = this.bounds();
  if (b.c1 <= box.c0 || b.c0 >= box.c1) return false;
  for (var i = 1; i < n; i++) {
    var x0 = p[i - 1][0], x1 = p[i][0];
    if (x1 < box.a0 || x0 > box.a1) continue;
    var c0 = p[i - 1][1], c1 = p[i][1], d0, d1;
    if (x1 > x0) {
      // the segment clipped to the box's own stretch of the axis
      var t0 = box.a0 > x0 ? (box.a0 - x0) / (x1 - x0) : 0;
      var t1 = box.a1 < x1 ? (box.a1 - x0) / (x1 - x0) : 1;
      d0 = c0 + (c1 - c0) * t0; d1 = c0 + (c1 - c0) * t1;
    } else { d0 = c0; d1 = c1; }
    var lo = d0 < d1 ? d0 : d1, hi = d0 < d1 ? d1 : d0;
    if (hi > box.c0 && lo < box.c1) return true;
  }
  return false;
};

// Where this line is at minute-position `a`, or null WHERE IT IS NOT.
//
// This used to hold its first and last value forever in both directions,
// which is harmless for a trunk -- a trunk spans the whole board by
// construction -- and wrong for anything that stops. A branch that halts at
// its event's tick went on being reported at that level for the rest of the
// day, so the picture drew it to the right-hand edge and every test that
// asks "is a line in the way" answered yes for a rail that is not there.
//
// A line is somewhere only between its own ends.
Line.prototype.cAt = function (a) {
  var p = this.pts;
  if (!p.length) return null;
  if (a < p[0][0] - 0.001 || a > p[p.length - 1][0] + 0.001) return null;
  if (a <= p[0][0]) return p[0][1];
  if (a >= p[p.length - 1][0]) return p[p.length - 1][1];
  for (var i = 1; i < p.length; i++) {
    if (a > p[i][0]) continue;
    var a0 = p[i - 1][0], c0 = p[i - 1][1], a1 = p[i][0], c1 = p[i][1];
    if (a1 === a0) return c1;
    return c0 + (c1 - c0) * (a - a0) / (a1 - a0);
  }
  return p[p.length - 1][1];
};

// A stop: where an event starts or ends on its line.
function Stop(spec) {
  this.line = spec.line;
  this.a = spec.a;
  this.c = spec.c;
  this.kind = spec.kind || 'start';  // 'start' (a dot) or 'end' (a tick)
}

// A CONVERGENCE: one event that several lines are at.
//
// On a transit map this is an interchange, and it is drawn as one heavy bar
// across the lines that meet there rather than as a stop on each of them.
// That is not decoration: dinner with four people is ONE dinner, and drawn as
// four separate stops with four copies of the name it reads as four things
// happening at once.
//
// So it has one name, and the name belongs to the bar rather than to any of
// the lines -- which is why a convergence's caption is the awkward one in
// every layout engine that has tried this. It has no rail of its own to hang
// off. Here it hangs off the BAR, which is a real object with a real extent,
// so it is the same kind of question as every other caption.
function Pill(spec) {
  this.id = spec.id;
  this.a = spec.a;                  // the minute it happens
  // AND HOW LONG IT LASTS. An interchange drawn as a mark at the middle of a
  // three-hour dinner says the five of them were in the same place for an
  // instant. Drawn across the event's own span it says how long they were
  // there, which is what the reader came for and costs nothing: the enclosure
  // has to be somewhere, and the minutes it covers are the honest place.
  this.a0 = spec.a0 == null ? spec.a : spec.a0;
  this.a1 = spec.a1 == null ? spec.a : spec.a1;
  this.lines = spec.lines || [];    // whose lines are in it
  this.c0 = spec.c0;                // the bar's extent across the board
  this.c1 = spec.c1;
  this.r = spec.r != null ? spec.r : 5;
  this.initials = spec.initials || [];
  this.tie = !!spec.tie;            // one bar at a minute, the lines left where they are
  this.joins = spec.joins || [];    // [{line, join:[a,c]|null, leave:[a,c]|null}]
}
Pill.prototype.box = function () {
  // THE BOX IS THE CAPSULE AS DRAWN, which reaches a mark's radius past the
  // outermost rail in it ACROSS the board as well as along. Measured to the
  // rails alone, the enclosure is a dozen pixels taller than the paper
  // anything was kept out of, and the names either side of a long shared
  // event came out written on its outline.
  return { a0: this.a0 - this.r, a1: this.a1 + this.r,
           c0: this.c0 - this.r, c1: this.c1 + this.r };
};

// FURNITURE: ink that is on the board before any event is.
//
// The hour strip, a line's name at its terminus, the "+3 earlier" note, the
// now-marker, a weather symbol, a service banner. None of it is an event and
// all of it takes paper, and the engine this replaces learned that the hard
// way -- every one of these was added after the layout was written, so each
// arrived as a special case the caption pass had to be told about
// separately, and the ones nobody remembered to mention got written over.
//
// One kind of thing, declared before the solve, and the caption search
// treats it exactly as it treats a rail: paper that is already spoken for.
function Furniture(spec) {
  this.id = spec.id;
  this.kind = spec.kind || 'note';   // what it is, for the renderer only
  this.a0 = spec.a0; this.a1 = spec.a1;
  this.c0 = spec.c0; this.c1 = spec.c1;
  this.text = spec.text || '';
  this.align = spec.align || 'left';
  // What a sky marker wears and the minute it is about: carried, because the
  // renderer draws the board and should never be reading the payload again.
  this.icon = spec.icon || null;
  this.at = spec.at == null ? null : spec.at;
  this.min = spec.min == null ? null : spec.min;   // the minute of the day it marks
  // Whose name this is, where it is one: the drawing puts the count of that
  // line's unnamed stops beside it, and a name that does not know whose it is
  // cannot be told how many.
  this.line = spec.line || null;
}
Furniture.prototype.box = function () {
  return { a0: this.a0, a1: this.a1, c0: this.c0, c1: this.c1 };
};

function Board(spec) {
  this.axis = spec.axis;            // {a0, a1} the drawable extent along
  this.cross = spec.cross;          // {c0, c1} and across
  this.cuts = spec.cuts || [];      // day boundaries along the axis
  this.lines = [];
  this.stops = [];
  this.caps = [];
  this.pills = [];
  this.fixed = [];
}
Board.prototype.addLine = function (s) { var l = new Line(s); this.lines.push(l); return l; };
Board.prototype.addStop = function (s) { var t = new Stop(s); this.stops.push(t); return t; };
Board.prototype.addCap = function (s) { var c = new Caption(s); this.caps.push(c); return c; };
Board.prototype.addPill = function (s) { var p = new Pill(s); this.pills.push(p); return p; };
Board.prototype.addFixed = function (s) { var f = new Furniture(s); this.fixed.push(f); return f; };
Board.prototype.lineByKey = function (k) {
  for (var i = 0; i < this.lines.length; i++) if (this.lines[i].key === k) return this.lines[i];
  return null;
};

// ---------------------------------------------------------------- the check
//
// WHAT IS WRONG WITH THIS BOARD, as data, with no browser and no suite.
//
// These are not opinions about taste; every one of them is a board a reader
// cannot read. They run in microseconds, which is the difference that
// matters: a check you can afford after every single change is a check that
// tells you which change did it.

function boxesOverlap(p, q) {
  return p.a0 < q.a1 && q.a0 < p.a1 && p.c0 < q.c1 && q.c0 < p.c1;
}

// TWO NAMES NEED PAPER BETWEEN THEM, NOT MERELY DIFFERENT BOXES.
//
// A caption's measured box is its ink plus three pixels either side, and the
// words wear a three-pixel paper outline that spends exactly that clearance
// keeping a rail out of the letters. Two boxes that simply touch therefore
// draw with their outlines interlocked and read as one word: "School Run"
// next to "Book Club" came out as "School RuBook Club" on a board this file
// had just certified as clean.
//
// So the test between two captions is fought at a clearance rather than at
// contact. Same clearance both ways round, because the board stands up as
// well as lying down and a gap that exists in one orientation and not the
// other is not a gap anyone designed.
//
// TWO PIXELS, AND MEASURED RATHER THAN CHOSEN. At four, the crowded case in
// cases.js -- twelve names on one line across seven hundred pixels -- sheds
// three of them, and a clearance that costs a name has stopped being a
// clearance. Two is enough to keep the outlines apart.
var CAP_CLEAR = 2;
function capsOverlap(p, q) {
  return p.a0 - CAP_CLEAR < q.a1 && q.a0 - CAP_CLEAR < p.a1
      && p.c0 - CAP_CLEAR < q.c1 && q.c0 - CAP_CLEAR < p.c1;
}

// How much of a segment of `line` lies inside `box`, in pixels along the
// axis. Sampled, because a rail is a polyline and the question is "how much
// of the reader's word is under ink", not "do they intersect".
function lineThrough(line, box, step) {
  if (!line.near(box)) return 0;
  step = step || 2;
  var cut = 0;
  for (var a = box.a0; a <= box.a1; a += step) {
    var c = line.cAt(a);
    if (c != null && c > box.c0 && c < box.c1) cut += Math.min(step, box.a1 - a);
  }
  return cut;
}
// ...and the same question when only YES OR NO is wanted, which is what the
// readability test asks.
//
// It is `near`, exactly, and that is not a shortcut: a polyline clipped to
// the box's own stretch of the axis is a run of straight segments, and a
// straight segment whose two clipped ends bracket the box's c extent passes
// through the box somewhere between them. The sampler this replaces asked
// the same question twelve times per box, missed a rail that crossed between
// two samples, and was the single most expensive thing the solver did once
// interchanges started sending rails across the board.
function lineTouches(line, box) {
  return line.near(box);
}

function check(board) {
  var faults = [];
  var i, j;
  // A caption off the paper is a caption nobody reads.
  for (i = 0; i < board.caps.length; i++) {
    var cp = board.caps[i], b = cp.box();
    if (b.a0 < board.axis.a0 - 0.5 || b.a1 > board.axis.a1 + 0.5
        || b.c0 < board.cross.c0 - 0.5 || b.c1 > board.cross.c1 + 0.5) {
      faults.push({ kind: 'offboard', what: cp.text, box: b });
    }
  }
  // Two captions on the same paper. The worst thing this board can do: one
  // of the two words is simply gone.
  for (i = 0; i < board.caps.length; i++) {
    for (j = i + 1; j < board.caps.length; j++) {
      var o = board.caps[i].box(), p = board.caps[j].box();
      if (!capsOverlap(o, p)) continue;
      faults.push({ kind: 'overlap', what: board.caps[i].text, with: board.caps[j].text,
                    px: Math.round(Math.min(o.a1, p.a1) - Math.max(o.a0, p.a0)) });
    }
  }
  // A caption written over the board's own furniture: the hour strip, a
  // line's name, a note at the end of the axis. All of it was on the board
  // before any event was, and none of it can move out of the way.
  for (i = 0; i < board.caps.length; i++) {
    for (j = 0; j < (board.fixed || []).length; j++) {
      if (!capsOverlap(board.caps[i].box(), board.fixed[j].box())) continue;
      faults.push({ kind: 'onfixed', what: board.caps[i].text, by: board.fixed[j].text || board.fixed[j].kind });
    }
  }
  // TWO LINES' NAMES ON EACH OTHER, which is the legend of the board gone.
  //
  // A terminus name follows its own rail, so this is never the caption
  // search's fault and never its to fix -- it says the BANDS are wrong: two
  // rails have arrived at the same level, which a reader sees as one line
  // whatever the map meant. It went unnoticed until the rails started
  // converging, because until then nothing made two of them meet.
  for (i = 0; i < (board.fixed || []).length; i++) {
    if (board.fixed[i].kind !== 'terminus') continue;
    for (j = i + 1; j < board.fixed.length; j++) {
      if (board.fixed[j].kind !== 'terminus') continue;
      if (!boxesOverlap(board.fixed[i].box(), board.fixed[j].box())) continue;
      faults.push({ kind: 'names', what: board.fixed[i].text, with: board.fixed[j].text });
    }
  }
  // SOMEBODY ELSE'S RAIL THROUGH A LINE'S NAME.
  //
  // The names used to sit in gutters outside the axis where no rail could
  // reach them. They sit inside the map now, in the row above their own line,
  // which bought the day two name-widths of axis and put them where another
  // line can run straight through the words. Like `names`, this is the BAND
  // search's to answer and not the caption search's -- a terminus follows its
  // own rail and has nowhere else to be -- so it is priced there and left out
  // of what `fit` counts.
  for (i = 0; i < (board.fixed || []).length; i++) {
    if (board.fixed[i].kind !== 'terminus') continue;
    var nb = board.fixed[i].box();
    for (j = 0; j < board.lines.length; j++) {
      var nl = board.lines[j];
      if (nl.key === board.fixed[i].line || nl.branchOf === board.fixed[i].line) continue;
      if (!lineTouches(nl, nb)) continue;
      faults.push({ kind: 'namecut', what: board.fixed[i].text, by: nl.key });
    }
  }
  // A caption written across an interchange bar. The bar is the heaviest ink
  // on the board -- it is several lines wide and drawn solid -- so a name on
  // it is not a name with a line through it, it is a name that is gone.
  for (i = 0; i < board.caps.length; i++) {
    for (j = 0; j < board.pills.length; j++) {
      if (!boxesOverlap(board.caps[i].box(), board.pills[j].box())) continue;
      faults.push({ kind: 'onbar', what: board.caps[i].text, by: board.pills[j].id });
    }
  }
  // A rail through a caption, INCLUDING ITS OWN. The pass this replaces
  // excluded a caption's own line on the grounds that a name travels with
  // the rail it names, which stopped being true the moment a rail could
  // climb: "Homer" is currently drawn through Homer's own line.
  for (i = 0; i < board.caps.length; i++) {
    var cb = board.caps[i].box();
    for (j = 0; j < board.lines.length; j++) {
      var cut = lineThrough(board.lines[j], cb, 2);
      if (cut > 1) {
        faults.push({ kind: 'pierce', what: board.caps[i].text,
                      by: board.lines[j].key, px: Math.round(cut),
                      own: board.lines[j].key === board.caps[i].line });
      }
    }
  }
  return faults;
}

// HOW MANY TIMES A RAIL ACTUALLY LEAVES ITS LEVEL, read off the drawing.
//
// Asked of the SEARCH instead -- "which events did the state mark as
// stepping" -- this gives the wrong answer, and it did: a board printed with
// three dead straight lines reported three steps, because the state had
// asked for them and the rail had refused all three for want of room. The
// intent and the drawing are different things and only one of them is on the
// panel. That is the whole fault this rewrite exists to remove, and it
// turned up in the test code within an hour of the rule being written down.
function bends(board) {
  var n = 0;
  board.lines.forEach(function (ln) {
    if (ln.branchOf) return;          // a spur's turns are its own, not the trunk's
    for (var i = 1; i < ln.pts.length; i++) {
      if (Math.abs(ln.pts[i][1] - ln.pts[i - 1][1]) > 0.5) n++;
    }
  });
  return n;
}

// A TRUNK THAT GOES OUT AND COMES STRAIGHT BACK: the mountain, again.
//
// "I see an up and down breakfast, just expecting an up" was about one
// event. The same shape comes back when two events near each other step in
// OPPOSITE directions: down for the first, up for the second, and what is
// drawn is a V. A step means the day changed level; a step immediately
// undone means nothing at all, and it reads as the line having wobbled.
//
// Counted off the drawing, on trunks only -- a branch leaving and a branch
// arriving are two different rails and never make this shape.
function bumps(board, near) {
  near = near || 60;
  var n = 0;
  board.lines.forEach(function (ln) {
    if (ln.branchOf) return;
    var last = null;
    for (var i = 1; i < ln.pts.length; i++) {
      var d = ln.pts[i][1] - ln.pts[i - 1][1];
      if (Math.abs(d) <= 0.5) continue;
      if (last && last.sign !== (d > 0 ? 1 : -1)
          && ln.pts[i - 1][0] - last.endA < near) n++;
      last = { sign: d > 0 ? 1 : -1, endA: ln.pts[i][0] };
    }
  });
  return n;
}

// A BEND TOO SMALL TO READ AS ONE. A diagonal of two pixels is not a line
// going somewhere, it is a kink in a line that should be straight, and a
// search rewarded for stepping will buy exactly that if nothing forbids it.
function wobbles(board, least) {
  var n = 0;
  board.lines.forEach(function (ln) {
    for (var i = 1; i < ln.pts.length; i++) {
      var d = Math.abs(ln.pts[i][1] - ln.pts[i - 1][1]);
      if (d > 0.5 && d < least) n++;
    }
  });
  return n;
}

// HOW FAR EACH NAME ENDED UP FROM THE LINE IT NAMES, in its own heights.
//
// Not a fault and not a matter of taste: it is whether the board answers the
// question it exists to answer. A caption three bands from its own rail is
// sitting against somebody else's, and the reader pairs words with the
// nearest line because that is what a transit map has taught them to do. A
// board can be clean by every test in `check` and still tell the reader that
// Physio is grandad's.
function pairing(board) {
  var worst = 0, who = null;
  board.caps.forEach(function (cp) {
    var ln = board.lineByKey(cp.line);
    if (!ln) return;
    // MEASURED WHERE THE LINE IS NEAREST, not where it is under the middle
    // of the words.
    //
    // A sloping rail has left by the time it reaches the caption's midpoint,
    // so a name sitting neatly against the START of a diagonal was reported
    // as nearly three rows adrift -- the same fault the candidate builder
    // had, in the measurement rather than in the placing. The question is
    // how far the words are from their line, and the answer is the closest
    // the two come.
    var bx = cp.box(), d = Infinity;
    var span = bx.a1 - bx.a0, stepA = Math.max(2, span / 12);
    for (var a = bx.a0; a <= bx.a1 + stepA; a += stepA) {
      var c = ln.cAt(Math.min(a, bx.a1));
      if (c == null) continue;
      var gap = c < bx.c0 ? bx.c0 - c : (c > bx.c1 ? c - bx.c1 : 0);
      if (gap < d) d = gap;
    }
    if (!isFinite(d)) return;
    var rows = d / Math.max(1, cp.h);
    if (rows > worst) { worst = rows; who = cp.text; }
  });
  return { rows: worst, what: who };
}

// ---------------------------------------------------------------- the print
//
// THE BOARD AS TEXT, because a board you can print is a board that exists.
//
// This is not decoration and it is not a debug aid bolted on afterwards: it
// is the acceptance test for the model. Anything the panel shows that cannot
// be printed here is something the model does not hold, and something the
// model does not hold is something the solver cannot reason about. That is
// the entire fault this rewrite exists to remove.
//
// Collisions are drawn as `#`, so a bad board is bad TO LOOK AT rather than
// bad according to a number.

function ascii(board, opts) {
  opts = opts || {};
  var cols = opts.cols || 150;
  var aSpan = board.axis.a1 - board.axis.a0 || 1;
  var cSpan = board.cross.c1 - board.cross.c0 || 1;
  // ENOUGH ROWS THAT THE PICTURE CANNOT LIE.
  //
  // At a coarse grid a caption sitting six pixels clear of its rail lands in
  // the same character cell as the rail, and the picture shows a collision
  // on a board `check` calls clean. A view that reports faults the data does
  // not have is worse than no view: it sends you looking for a bug that is
  // in the renderer. So the row count is taken from the board -- the
  // shortest caption gets at least two rows, and its clearance at least one
  // -- unless the caller insists.
  // A 45 DEGREE RAIL HAS TO LOOK LIKE ONE.
  //
  // A character cell is about twice as tall as it is wide, so a grid whose
  // rows and columns cover the same number of pixels draws every slope twice
  // as steep as it is: Donut Break's climb came out looking near vertical on
  // a rail that is at exactly 45 degrees. The board's whole grammar is flat,
  // upright, or 45, and a picture that cannot tell the three apart is not
  // showing the thing being judged.
  //
  // So the rows are chosen to make a pixel square ON THE PAGE: a row covers
  // the same board distance as a column, times the cell's own aspect. The
  // fine-grained mode is still there for reading a crowded band closely, and
  // `check` decides either way.
  var rows = opts.rows;
  if (!rows && !opts.fine) {
    var perCol = aSpan / Math.max(1, cols - 1);
    rows = Math.max(8, Math.min(opts.maxRows || 200,
      Math.round(cSpan / (perCol * (opts.cellAspect || 1.9))) + 1));
  }
  if (!rows) {
    // The finest thing the picture has to keep apart is not a caption's
    // height: it is the CLEARANCE a caption keeps from the rail beside it,
    // which is smaller. Sized to the height alone, a caption sitting six
    // pixels off its line landed in the line's own character row and the
    // board printed a wall of `#` that `check` calls clean. A view that
    // invents faults sends you hunting a bug that is in the renderer.
    var fine = cSpan / 8;
    board.caps.forEach(function (cp) {
      fine = Math.min(fine, cp.h / 2);
      var bx = cp.box();
      board.lines.forEach(function (ln) {
        var c = ln.cAt((bx.a0 + bx.a1) / 2);
        if (c == null) return;
        var d = c < bx.c0 ? bx.c0 - c : (c > bx.c1 ? c - bx.c1 : 0);
        if (d > 0.5) fine = Math.min(fine, d);
      });
    });
    rows = Math.max(12, Math.min(opts.maxRows || 200, Math.ceil(cSpan / Math.max(1, fine))));
  }
  var colF = function (a) { return (a - board.axis.a0) / aSpan * (cols - 1); };
  var rowF = function (c) { return (c - board.cross.c0) / cSpan * (rows - 1); };
  var col = function (a) { return Math.round(colF(a)); };
  var row = function (c) { return Math.round(rowF(c)); };

  var grid = [], owner = [], inkAt = [];
  for (var r = 0; r < rows; r++) {
    grid.push(new Array(cols).fill(' '));
    owner.push(new Array(cols).fill(null));
    inkAt.push(new Array(cols).fill(null));
  }
  // WHOSE PAPER EACH CELL IS, kept beside the picture rather than inferred
  // from it. A caption occupies a BOX, not a row of letters, so a rail
  // through the white space above the words is through the caption just as
  // much as one through the letters. Drawn from the characters alone that
  // was invisible, which is the same mistake as measuring a caption by its
  // text: it is the box that has to be clear.
  function claim(r, c, who) {
    if (r < 0 || r >= rows || c < 0 || c >= cols) return;
    if (owner[r][c] == null) owner[r][c] = who;
  }
  // INK MARKS A CLASH ONLY WHERE IT REALLY IS ONE.
  //
  // A cell is several pixels of board, so "this cell holds words and this
  // cell holds a rail" is not the same statement as "the rail is in the
  // words". At any grid coarse enough to draw a 45 degree slope as a 45
  // degree slope, a caption sitting six pixels clear of its line shares that
  // line's row -- and the picture printed a solid block of `#` across a
  // board `check` calls clean.
  //
  // So ink carries the board position it was sampled at, and a clash is
  // confirmed against the caption's real box before it is drawn. The picture
  // and the checker now answer from the same numbers and cannot disagree.
  // Ink remembers WHERE ON THE BOARD it was sampled, so the words drawn over
  // it afterwards can ask whether they are really on top of it or merely in
  // the same character cell.
  function put(r, c, ch, ink, atA, atC) {
    if (r < 0 || r >= rows || c < 0 || c >= cols) return;
    if (grid[r][c] === '#') return;
    if (ink && atA != null) inkAt[r][c] = { a: atA, c: atC };
    grid[r][c] = ch;
  }

  // Rails, sampled per column so a slope draws as a slope.
  board.lines.forEach(function (ln) {
    var prev = null;
    for (var cc = 0; cc < cols; cc++) {
      var a = board.axis.a0 + cc / (cols - 1) * aSpan;
      var c = ln.cAt(a);
      if (c == null) { prev = null; continue; }
      var rr = row(c);
      var ch = '-';
      if (prev != null) {
        if (rr < prev - 0.5) ch = '/';
        else if (rr > prev + 0.5) ch = '\\';
        // a real step: fill the column between so a climb reads as connected
        var lo = Math.min(rr, prev), hi = Math.max(rr, prev);
        // The fill between two samples is a CONNECTOR, not a measurement:
        // it stands for the rail's travel between one column and the next,
        // which is a span of board wider than the column it is drawn in. Ink
        // that is only there to join two samples up must not be allowed to
        // report a collision -- that is a column's worth of rounding, and it
        // printed `#` on a rail that passes cleanly under a caption. The
        // sampled characters either side are the honest ones.
        if (hi - lo > 1) for (var f = lo; f <= hi; f++) put(f, cc, '|', false);
      }
      put(rr, cc, ch, true, a, c);
      prev = rr;
    }
  });

  // Furniture, claimed like a caption so a rail across it shows as `#`.
  (board.fixed || []).forEach(function (fx) {
    var b = fx.box();
    var r0 = Math.ceil(rowF(b.c0)), r1 = Math.floor(rowF(b.c1));
    var c0 = Math.ceil(colF(b.a0)), c1 = Math.floor(colF(b.a1));
    for (var rr = r0; rr <= r1; rr++) for (var cc = c0; cc < c1; cc++) claim(rr, cc, fx);
  });

  // Interchange bars: one stroke across every line that meets there.
  board.pills.forEach(function (pl) {
    var cc = col(pl.a);
    for (var rr = row(pl.c0); rr <= row(pl.c1); rr++) {
      put(rr, cc, 'I', true, pl.a, board.cross.c0 + (rr / (rows - 1)) * cSpan);
    }
  });

  // Stops on top of their rail: a dot to start, a tick to end.
  board.stops.forEach(function (st) {
    put(row(st.c), col(st.a), st.kind === 'end' ? '+' : 'o', true, st.a, st.c);
  });

  // THE WORDS GO ON LAST, AND THEY WIN THE CELL.
  //
  // Drawn first, they were silently rubbed out. A caption sitting six pixels
  // clear of its rail shares that rail's character row at any grid coarse
  // enough to draw a slope honestly, and since the rail is not really in the
  // words there was no clash to report -- so the rail simply overwrote the
  // letters and the board printed with a caption missing. "Quick Sync" was
  // gone from the picture while sitting perfectly placed on the board, which
  // is the worst thing a view can do: it does not show a fault, it shows a
  // board that does not exist.
  //
  // So ink is laid down first and the words go over it. Where a letter lands
  // on ink the two are checked against each other IN BOARD COORDINATES: if
  // the ink is really inside the caption's box that is a genuine pierce and
  // it prints `#`, and if it is not, the letter wins the cell and the rail
  // appears to pass behind the words. Nothing is ever rubbed out silently.
  board.caps.forEach(function (cp) {
    var b = cp.box();
    var r0 = row(b.c0), r1 = row(b.c1), c0 = col(b.a0), c1 = col(b.a1);
    var mid = Math.round((r0 + r1) / 2);
    var cr0 = Math.ceil(rowF(b.c0)), cr1 = Math.floor(rowF(b.c1));
    var cc0 = Math.ceil(colF(b.a0)), cc1 = Math.floor(colF(b.a1));
    for (var rr = cr0; rr <= cr1; rr++) for (var cc = cc0; cc < cc1; cc++) claim(rr, cc, cp);
    var room = Math.max(0, c1 - c0);
    var txt = cp.text.length <= room ? cp.text
      : (room > 2 ? cp.text.slice(0, room - 1) + '\u2026' : cp.text.slice(0, room));
    // ...AND THEY SIT ON THEIR OWN SIDE OF THE RAIL, even when the grid
    // cannot quite tell the two apart.
    //
    // A caption six pixels clear of its line lands in that line's character
    // row, so the words print along the rail and read as being ON it, which
    // is the one thing this board must never say by accident. Where the row
    // the arithmetic picked is occupied by ink that is NOT in the caption's
    // box, the words step one row toward their own side -- which is where
    // they are, just too near to resolve.
    function foreign(rr) {
      if (rr < 0 || rr >= rows) return true;
      for (var q = 0; q < txt.length; q++) {
        var cq = c0 + q;
        if (cq < 0 || cq >= cols) continue;
        var ik = inkAt[rr][cq];
        if (!ik) continue;
        if (ik.c > b.c0 && ik.c < b.c1) continue;   // really inside: a pierce, not a clash of cells
        return true;
      }
      return false;
    }
    var away = 0;
    for (var q2 = 0; q2 < txt.length && !away; q2++) {
      var ik2 = inkAt[Math.max(0, Math.min(rows - 1, mid))][c0 + q2];
      if (ik2) away = ik2.c > b.c1 ? -1 : (ik2.c < b.c0 ? 1 : 0);
    }
    var useRow = mid;
    if (foreign(mid) && away) {
      for (var d = 1; d <= 2; d++) {
        if (!foreign(mid + away * d)) { useRow = mid + away * d; break; }
      }
    }
    for (var k = 0; k < txt.length; k++) {
      var cc2 = c0 + k;
      if (useRow < 0 || useRow >= rows || cc2 < 0 || cc2 >= cols) continue;
      if (grid[useRow][cc2] === '#') continue;
      var ia = inkAt[useRow][cc2];
      if (ia && ia.a > b.a0 && ia.a < b.a1 && ia.c > b.c0 && ia.c < b.c1) {
        grid[useRow][cc2] = '#';
      } else {
        grid[useRow][cc2] = txt[k];
      }
    }
  });

  var out = grid.map(function (g) { return g.join('').replace(/\s+$/, ''); });
  // Trim the blank rows top and bottom so a quiet board does not print as a
  // page of nothing.
  while (out.length && !out[0].trim()) out.shift();
  while (out.length && !out[out.length - 1].trim()) out.pop();
  return out.join('\n');
}

// A board, its faults, and the picture, as one string. This is what a failing
// case prints, because "two captions overlap" is a fact and the picture is
// the explanation.
function report(board, opts) {
  var faults = check(board);
  var lines = [ascii(board, opts), ''];
  if (!faults.length) {
    lines.push('clean: ' + board.caps.length + ' caption(s), ' + board.lines.length + ' line(s)');
  } else {
    lines.push(faults.length + ' fault(s):');

          var pa = pill.a - want.w / 2 + slides[pk] * want.w;
          out.push({ want: want, a: pa, c: pc, side: pside, row: pr, pbox: pbox,
                     slide: slides[pk] * want.w, railC: pside > 0 ? pill.c1 : pill.c0 });
        }
      }
    }
    // ...AND BESIDE IT. A box around four rails is taller than a name, and
    // above and below it are exactly where those rails arrive and leave, so
    // the name was pushed a band away from the thing it names while the
    // paper level with the box stood empty. Level with it, at each row the
    // box is tall enough to hold, on either end.
    // Three places a side -- level with the top of the box, its middle and
    // its bottom -- and no more: every candidate is checked against every
    // rail, and a box's worth of rows was a measurable share of the solve.
    var mid = (pbox.c0 + pbox.c1) / 2 - want.h / 2;
    for (var es = 0; es < 2; es++) {
      var eside = es ? -1 : 1;
      var ea = eside > 0 ? pbox.a1 + want.gap : pbox.a0 - want.gap - want.w;
      [pbox.c0, mid, pbox.c1 - want.h].forEach(function (ec, ei) {
        if (ec < pbox.c0 - 0.5 || ec + want.h > pbox.c1 + 0.5) return;
        if (ei && Math.abs(ec - pbox.c0) < 1) return;   // a short box: one row is all of them
        out.push({ want: want, a: ea, c: ec, side: 0, row: 0, slide: 0, pbox: pbox,
                   railC: eside > 0 ? pill.c1 : pill.c0, beside: eside });
      });
    }
    return out;
  }
  // The rail this event actually sits on, which is its own branch when it
  // took a shelf and its owner's trunk otherwise.
  var line = board.lineByKey(want._rail || want.line);
  if (!line) return out;
  // TWO RAILS TO STAND BESIDE, WHERE THE EVENT IS A SLOPE.
  //
  // A caption's height comes from the rail under the middle of its words,
  // which is right for a mark and wrong for a step: the words are wider
  // than the event, so their middle lands on the FLAT part beyond the
  // diagonal and the caption sits out on the level the line has already
  // left -- a name floating beside nothing while its own event slopes away
  // from it.
  //
  // The fix for that was to measure at the DOT, and it swapped one fault
  // for the other: the name is then beside the level the line is ABOUT to
  // leave, and on the demo board "Reactor Core Check" sat two bands clear
  // of the rail that was its event, with the wedge the slope had just
  // opened standing empty underneath it.
  //
  // Neither reference is right for every board, so both are offered and
  // the price decides -- which it can now do honestly, because `off` is the
  // gap the words really have from their own rail rather than the number of
  // rows from whichever point they were built against.
  //
  // WORDS WIDER THAN THE RAIL THEY HANG OFF. A spur halts at its tick, so a
  // half-hour event on one is a stub shorter than its own name, and every
  // position whose middle lay past the tick had no rail under it to measure
  // from and was never offered. The dot is on the rail whatever the words
  // do, so it is the reference when the middle is off the rail.
  // A spur that begins after its event's minute (past a merge diamond) is
  // measured from where it begins: that is where its dot is.
  var wa0 = line.branchOf && line.pts.length && line.pts[0][0] > want.a0 ? line.pts[0][0] : want.a0;
  var c0s = line.cAt(wa0), c1s = line.cAt(want.a1);
  var sloped = c0s != null && c1s != null && Math.abs(c1s - c0s) > 1;
  for (var si = 0; si < 2; si++) {
    var side = si ? -1 : 1;
    for (var r = 0; r < rows; r++) {
      var out_ = want.gap + r * step;
      var sl = r ? slides : fine;
      for (var k = 0; k < sl.length; k++) {
        var a = wa0 + sl[k] * want.w;
        var mid = a + want.w / 2;
        // BOTH LEVELS WHEREVER THEY DIFFER, not only on a slope. Lisa's
        // rail was level at her dot and up in the dinner by the middle of
        // the words, so every slide to the right of the dot was measured
        // from the dinner and refused, and the notch beside her dot went
        // unused. Where the rail under the middle is not the rail at the
        // dot, both are offered and the measured `off` prices them.
        var refs = [];
        if (c0s != null) refs.push(c0s);
        var gotMid = line.cAt(mid);
        if (gotMid != null && (c0s == null || Math.abs(gotMid - c0s) > 1)) refs.push(gotMid);
        if (!refs.length) continue;
        // WHERE THE RAIL RUNS UNDER THESE WORDS, as a band. Sampled three
        // times rather than once: a diagonal has a different height at each
        // end of a caption, and the gap that matters is the nearest one.
        var lo = Infinity, hi = -Infinity;
        [a, mid, a + want.w].forEach(function (x) {
          var cc = line.cAt(x);
          if (cc == null) return;
          if (cc < lo) lo = cc;
          if (cc > hi) hi = cc;
        });
        for (var ri = 0; ri < refs.length; ri++) {
          var railC = refs[ri];
          var c = side > 0 ? railC + out_ : railC - out_ - want.h;
          var near = !isFinite(lo) ? out_
            : (c > hi ? c - hi : (c + want.h < lo ? lo - (c + want.h) : 0));
          out.push({ want: want, a: a, c: c, side: side, row: r,
                     // In rows, and zero while the words are as close as a
                     // caption is allowed to get, so row 0 is still free.
                     off: Math.max(0, (near - want.gap) / step),
                     slide: sl[k] * want.w, railC: railC });
        }
      }
    }
  }
  // ...AND BESIDE THE DOT, LEVEL WITH IT, where the event is a slope. The
  // rail leaves the dot at 45 degrees and the paper beside the dot on the
  // other side of the slope is a notch nothing else can use: a name there,
  // ranged towards the dot, is as close as a name gets -- "labels like
  // Detention should have the label on left or right of the slope."
  // Offered on both sides; a flat rail through the words refuses it.
  if (sloped) {
    [[wa0 - want.gap - want.w, c0s], [want.a1 + want.gap, c1s]].forEach(function (bs) {
      // Centred on the mark, or with the words' near edge level with it:
      // against a rising slope the notch is above the dot and the name's
      // bottom row sits level with it, which is the mockup exactly.
      [bs[1] - want.h / 2, bs[1] - want.h + want.gap / 2, bs[1] - want.gap / 2].forEach(function (bc) {
        out.push({ want: want, a: bs[0], c: bc, side: 0, row: 0, off: 0, slide: 0,
                   railC: bs[1], beside: true });
      });
    });
  }
  return out;
}

function posBox(p) {
  return { a0: p.a - p.want.pad, a1: p.a + p.want.w + p.want.pad,
           c0: p.c, c1: p.c + p.want.h };
}

// ---------------------------------------------------------------- the facts
//
// Whether a position is READABLE at all, which is a yes or a no and never a
// price. Everything here is checked against the board's fixed ink -- the
// rails and the edges -- so the answer does not depend on any other caption.

// `near` is the part of the board this candidate can possibly touch, worked
// out once per caption from the envelope of all its candidates (solve):
// every candidate used to be tested against every rail and every piece of
// furniture on the board, and on a seven-line day that was the single
// largest cost of a solve. Absent, the whole board is used.
function readable(p, board, near) {
  var b = posBox(p);
  // A NAME STAYS ON ITS EVENT'S DAY. Across a day boundary the words are
  // read as tomorrow's, and "Moe's Tavern" at half past eleven at night
  // was written into the small hours: "the event labels move over to the
  // other days, that should never be allowed." Not across the cut, and
  // not on the far side of it either.
  var cuts = board.cuts || [];
  for (var di = 0; di < cuts.length; di++) {
    if (p.want.a0 < cuts[di] ? b.a1 > cuts[di] : b.a0 < cuts[di]) return false;
  }
  var lines = near ? near.lines : board.lines;
  var fixed = near ? near.fixed : (board.fixed || []);
  var pills = near ? near.pills : board.pills;
  if (b.a0 < board.axis.a0 || b.a1 > board.axis.a1) return false;
  if (b.c0 < board.cross.c0 || b.c1 > board.cross.c1) return false;
  // A rail through the words, INCLUDING THE CAPTION'S OWN. A name travels
  // with the rail it names only while that rail is flat; once it can climb,
  // its own line is as much in the way as anybody's.
  var ownLine = near ? near.own : (p.want.pill ? null : board.lineByKey(p.want._rail || p.want.line));
  for (var i = 0; i < lines.length; i++) {
    var bb = b;
    // BESIDE THE SLOPE, THE SLOPE MAY TUCK UNDER THE CORNER. A name level
    // with its dot and ranged against it has its own rail leaving the dot
    // at 45 degrees right under its nearest corner: measured to the box the
    // rail touches it by a few pixels, and the mockup's placement was
    // refused every time. Its own rail is tested against the box less a
    // gap on the side facing the dot; every other rail sees the whole box.
    if (p.beside && lines[i] === ownLine) {
      var tuck = p.want.gap * 1.5;
      bb = p.a + p.want.w <= p.want.a0 ? { a0: b.a0, a1: b.a1 - tuck, c0: b.c0, c1: b.c1 }
                                       : { a0: b.a0 + tuck, a1: b.a1, c0: b.c0, c1: b.c1 };
    }
    if (B.lineTouches(lines[i], bb)) return false;
  }
  // The board's own furniture cannot move, so a name that lands on it loses.
  for (var fi = 0; fi < fixed.length; fi++) {
    // AT A CLEARANCE. The board's furniture is words too -- a line's name, a
    // note, the clock -- and two boxes that merely touch draw with their
    // paper outlines interlocked: "Sam" and "School Run" came out as one
    // string on a board this file had called clean. Same test as between two
    // captions, for the same reason.
    if (B.capsOverlap(b, fixed[fi].box())) return false;
  }
  // An interchange bar is the heaviest ink on the board, so words on one are
  // words that are gone.
  for (var pj = 0; pj < pills.length; pj++) {
    if (B.boxesOverlap(b, pills[pj].box())) return false;
  }
  // AND NO OTHER LINE MAY LIE BETWEEN THE WORDS AND THE LINE THEY NAME.
  //
  // This was a preference and it should never have been one. A caption pays
  // for standing further from its rail, so with the price set anywhere
  // sensible the search will happily put a name three bands out rather than
  // give up its time row -- and three bands out, with two rails in between,
  // the reader does not read it as three bands out. They read it as
  // belonging to the line it is next to. "Grocery Delivery" came out under
  // the bottom rail of a two-line board, naming an event on the top one.
  //
  // That is not a tidiness question, it is the board telling the reader
  // something false, so it is a FACT and the position is refused. What the
  // search does instead -- shorten the words, take another row, shed as a
  // last resort -- is then a real choice between real options, which is
  // what the ladder is for.
  var own = ownLine;
  // THE SAME FOR A CONVERGENCE'S NAME AND ITS BOX. Free to sit three rows
  // out for a few points, "Family Dinner" went to the top of the OG board
  // on the far side of Maggie's rail from the dinner, with its leader lying
  // exactly under her descent -- a name that reads as Maggie's. No rail may
  // lie between the words and the box, whichever side they are on.
  // Only from the second row out: against the box there is no paper for a
  // rail to lie in, and the check costs a sample of every rail per
  // candidate.
  if (p.want.pill && p.pbox && p.side && p.row > 0) {
    var pb = p.pbox;
    var bandLo = p.side < 0 ? b.c1 : pb.c1, bandHi = p.side < 0 ? pb.c0 : b.c0;
    for (var jj = 0; jj < lines.length; jj++) {
      var qq = lines[jj], qbb = qq.bounds();
      // Only a rail that reaches into the paper between the words and the
      // box can lie across it; the rest are skipped before any sampling,
      // which is what keeps this cheap enough to ask of every candidate.
      if (qbb.c1 <= bandLo || qbb.c0 >= bandHi) continue;
      if (qbb.a1 < b.a0 || qbb.a0 > b.a1) continue;
      for (var kk = 0; kk < 3; kk++) {
        var att = b.a0 + (b.a1 - b.a0) * (kk / 2);
        if (att < qbb.a0 || att > qbb.a1) continue;
        var qcc = qq.cAt(att);
        if (qcc != null && qcc > bandLo && qcc < bandHi) return false;
      }
    }
  }
  if (own) {
    for (var k = 0; k < 3; k++) {
      var at = b.a0 + (b.a1 - b.a0) * (k / 2);
      var ownC = own.cAt(at);
      // Past the end of its own rail the words still belong to the level
      // they were measured from: a name hanging off a short spur is not free
      // to cross the trunk just because the spur has already halted.
      if (ownC == null) ownC = p.railC;
      if (ownC == null) continue;
      for (var j = 0; j < lines.length; j++) {
        var q = lines[j];
        if (q === own) continue;
        var qb = q.bounds();
        if (at < qb.a0 || at > qb.a1) continue;
        var qc = q.cAt(at);
        if (qc == null) continue;
        if (ownC <= b.c0 && qc > ownC && qc < b.c1) return false;
        if (ownC >= b.c1 && qc < ownC && qc > b.c0) return false;
      }
    }
  }
  return true;
}

// ------------------------------------------------------------ the preferences
//
// How good a readable position is, in one currency, all of it about the
// reader pairing the words with the right stop. Lower is better.

function price(p) {
  var w = p.want;
  // HOW FAR THE WORDS ARE FROM THE STRETCH OF RAIL THAT IS THEIR EVENT.
  //
  // Measured from the start of the words to the start of the event, sliding
  // a caption a whole width to the left cost about two points -- nothing --
  // so a name drifted off its own event for the smallest tidiness anywhere
  // else. Measured to the SPAN, a caption standing over any part of the
  // thing it names is free, and one that has left it pays by how far.
  var along, lo = p.a, hi = p.a + w.w;
  if (w.pill) {
    // TO THE BOX, not to its middle minute. The enclosure is as long as the
    // event, and a name anywhere along it, or standing against either end
    // of it, is naming it; only a name that has left the box pays.
    var pb = p.pbox;
    if (pb) along = hi < pb.a0 ? pb.a0 - hi : (lo > pb.a1 ? lo - pb.a1 : 0);
    else along = Math.abs((p.a + w.w / 2) - w.a0);
  } else {
    along = hi < w.a0 ? w.a0 - hi : (lo > w.a1 ? lo - w.a1 : 0);
  }
  // ...and how far off its own rail it stands. A name a band away from its
  // line is a name the reader has to guess the owner of, and it is the
  // expensive thing here, not the cheap one.
  //
  // MEASURED, NOT COUNTED. This was the row index -- how many steps out from
  // whatever point the position was built against -- which is the same thing
  // as the real gap only while the rail is flat under the words. Where the
  // event is a slope it is not: a caption built one row off the rail AT THE
  // DOT can be two bands clear of the rail beside its own words, and counted
  // it looked as cheap as one lying against it.
  var off = p.off != null ? p.off : p.row;
  // FREE WHILE THE MARK IS UNDER THE WORDS, AND STEEP ONCE IT IS NOT.
  //
  // Charged flat, drifting was almost free -- a caption sixty pixels clear
  // of its own dot cost less than two points, so it went wherever was
  // tidiest and "Quick Sync" and "Client Workshop" both came out sitting a
  // long way right of the marks they name. Charged HARD, a caption would
  // rather climb two rows than move sideways, and names ended up three rows
  // off their rail. Both were tried and both are wrong, because the thing
  // being priced is not linear: a few pixels is invisible, and past the
  // point where the mark is no longer under the words the pairing is simply
  // gone.
  //
  // So: nothing at all while the words cover their own mark, and rising
  // sharply after that. It is the same shape the old engine reached for and
  // could not state -- "a caption that has slid more than about half its own
  // width from its mark has stopped pointing at it".
  // ABOVE THE RAIL WHEN NOTHING ELSE DECIDES. Half a point: not a
  // preference the search will spend anything on, only the answer to a tie,
  // and the answer the board this replaces gave -- the name over its mark,
  // read down onto the rail.
  return along * 0.04 + Math.max(0, along - 6) * Math.max(0, along - 6) * 0.04
       + off * off * 6 + Math.abs(p.slide) * 0.01 + (p.side > 0 ? 0.5 : 0);
}

// --------------------------------------------------------------- the solve
//
// Facts first, then preferences, then the one thing neither can express on
// its own: two captions wanting the same paper. That pair cost is why this is
// a search rather than a sort.
//
// Greedy seed, then simulated annealing over "move one caption to another of
// its own positions". The seed is in start-time order, which is the order a
// reader scans in, so a board with room comes out in reading order and the
// annealing only has to work where there is not room.

// WHICH MARK A READER WOULD PAIR THESE WORDS WITH.
//
// What a reader actually does is claim the marks the words lie over, and
// failing that the nearest one at that level. So the distance is to the BOX:
// nothing at all while a dot is under the words, and the gap beyond them
// otherwise. A caption that covers somebody else's dot and not its own is
// exactly what it looks like; one placed to the left of its own dot, clear
// of its neighbour, is fine.
//
// COVERING TWO MARKS IS AMBIGUOUS EVEN WHEN ONE OF THEM IS YOURS. A reader
// cannot pick between two marks under one name; it does not matter that one
// of them is the right one.
//
// Other marks are filtered by LEVEL -- a name is only mistakable for
// something on the rail it is sitting against -- and its own is not, because
// when an event IS a step the diagonal carries its caption to a level its
// own dot is not at.
//
// THIS LIVES HERE, WITH THE CAPTION SEARCH, AND NOT ONLY IN THE BAND
// SEARCH'S PRICE. Priced only at the board level it was invisible to the
// captions themselves: a name slid over its neighbour's dot whenever that
// was a point tidier, and the only thing that could undo it was the band
// search finding a step that moved the two marks to different levels. On the
// OG demo board that step stopped fitting the day a spur took its room, and
// "Detention" sat over Skate Park's dot with a clean slide to its left going
// unused. A caption that knows the price picks the slide.
function markDots(wants, board) {
  var dots = [];
  wants.forEach(function (w, i) {
    if (w.pill) return;
    var ln = board.lineByKey(w._rail || w.line);
    if (!ln) return;
    var c = ln.cAt(w.a0);
    if (c == null) return;
    dots.push({ i: i, a: w.a0, a1: w.a1, c: c });
  });
  return dots;
}
function muddledAt(p, i, dots, minLift, cache) {
  var w = p.want;
  if (w.pill) return false;
  var lo = p.a, hi = p.a + w.w;
  // The marks at this level, found once per want and level rather than once
  // per candidate: a solve asks this for every candidate of every name, and
  // the level filter is most of the work.
  var key = i + ':' + Math.round(p.railC), level = cache[key];
  if (!level) {
    level = cache[key] = { own: null, near: [] };
    for (var d0 = 0; d0 < dots.length; d0++) {
      if (dots[d0].i === i) level.own = dots[d0];
      else if (Math.abs(dots[d0].c - p.railC) <= minLift) level.near.push(dots[d0]);
    }
  }
  var best = -1, bestD = Infinity, tied = 0, own = level.own;
  for (var d = 0; d < level.near.length; d++) {
    var da = level.near[d].a, dist = da < lo ? lo - da : (da > hi ? da - hi : 0);
    if (dist < bestD - 0.001) { bestD = dist; best = level.near[d].i; tied = 1; }
    else if (dist < bestD + 0.001) tied++;
  }
  if (own) {
    // ITS OWN MARK IS ITS WHOLE EVENT. An eight-hour "Desk booking" has one
    // dot at eight in the morning and its name is wherever along the day
    // there is room for it; measured to the dot alone, the name was
    // "nearest" every other dot on the rail wherever it stood, and the only
    // way the board could clear the fault was to move somebody else's mark
    // to another level. The words over any part of the event are on it.
    var oa1 = own.a1 > own.a ? own.a1 : own.a;
    var od = hi < own.a ? own.a - hi : (lo > oa1 ? lo - oa1 : 0);
    if (od < bestD - 0.001) { bestD = od; best = i; tied = 1; }
    else if (od < bestD + 0.001) { bestD = od; best = i; tied++; }
  }
  return best >= 0 && (best !== i || tied > 1);
}

function solve(wants, board, opts) {
  opts = opts || {};
  var n = wants.length;
  var cache = opts.cache || null;
  var cands = wants.map(function (w) {
    // THE PART OF THE BOARD THESE CANDIDATES CAN REACH, once per caption:
    // the rows either side of its own rail (or its bar), a name's width
    // beyond the event at each end. Only what is in it can refuse a
    // candidate, so only that is tested -- and only that has to be the
    // same for the answer to be the same.
    var own = w.pill ? null : board.lineByKey(w._rail || w.line);
    var pill = null;
    if (w.pill) for (var pi = 0; pi < board.pills.length; pi++) if (board.pills[pi].id === w.pill) pill = board.pills[pi];
    var reach = w.gap + (opts.rows || 4) * (w.h + 3) + w.h + w.pad + 4;
    var ob = own ? own.bounds() : (pill ? pill.box() : null);
    if (!ob) return [];
    var env = { a0: w.a0 - w.w * 1.2 - w.pad - 4, a1: w.a1 + w.w * 1.2 + w.pad + 4,
                c0: ob.c0 - reach, c1: ob.c1 + reach };
    var m = B.CAP_CLEAR + 1;
    var near = {
      own: own,
      lines: board.lines.filter(function (l) {
        var lb = l.bounds();
        return l === own || !(lb.a1 < env.a0 || lb.a0 > env.a1 || lb.c1 <= env.c0 || lb.c0 >= env.c1);
      }),
      fixed: (board.fixed || []).filter(function (f) {
        var fb = f.box();
        return !(fb.a1 < env.a0 - m || fb.a0 > env.a1 + m || fb.c1 < env.c0 - m || fb.c0 > env.c1 + m);
      }),
      pills: board.pills.filter(function (pl) {
        var pb = pl.box();
        return !(pb.a1 < env.a0 || pb.a0 > env.a1 || pb.c1 < env.c0 || pb.c0 > env.c1);
      }),
    };
    // REMEMBERED ACROSS TRIALS. The band search prices hundreds of boards
    // that differ in one gap or one move, and on most of them most
    // captions see exactly the rails and furniture they saw last time.
    // The key is everything a candidate's readability depends on: the
    // words' size, the rail they hang off, and what is near.
    var key = null;
    if (cache) {
      key = w.id + '|' + w.w + 'x' + w.h + '|' + (w._rail || w.line || w.pill) + '|';
      near.lines.forEach(function (l) { key += l.key + ':' + JSON.stringify(l.pts) + ';'; });
      near.fixed.forEach(function (f) { var fb = f.box(); key += f.id + ':' + fb.a0 + ',' + fb.a1 + ',' + fb.c0 + ',' + fb.c1 + ';'; });
      near.pills.forEach(function (pl) { key += pl.id + ':' + pl.a + ',' + pl.a0 + ',' + pl.a1 + ',' + pl.c0 + ',' + pl.c1 + ',' + pl.r + ',' + pl.tie + ';'; });
      key += '|' + (board.cuts || []).join(',') + '|' + board.axis.a0 + ',' + board.axis.a1 + ',' + board.cross.c0 + ',' + board.cross.c1;
      if (cache[key]) return cache[key];
    }
    var ps = positions(w, board, opts).filter(function (p) { return readable(p, board, near); });
    if (cache) cache[key] = ps;
    return ps;
  });
  // Every candidate knows whether a reader could mistake it, before any
  // price is paid.
  var dots = markDots(wants, board);
  var minLift = opts.minLift != null ? opts.minLift : 14;
  var MUD = opts.muddlePrice != null ? opts.muddlePrice : 40000;
  var levels = {};

      // lead so the branch is still drawn as a branch.

      var clear = spec.markR * 1.68 + 1;

      // `a0` left from the corner, and on the OG board Assembly branched

      var runFrom = bd.a0;

    // somewhere else. Deeper buys nothing: the reader only has to see that

// WHAT THIS ALLOCATION IS WORTH, which is WHAT THE CAPTIONS DO ON IT.
//
// Counting how many places each caption has was the first thing tried here
// and it has no gradient: every caption on a board with any room at all has
// more places than the count cares about, so the score is zero everywhere
// and the search wanders. Measured on the four-line board, it returned the
// even spread it started from, which is the same answer the old engine gives
// and for the same reason -- nothing was asking the real question.
//
// The real question is what the words do, so it places them. Greedily and
// with no annealing: that is a few hundred microseconds, it is deterministic
// (so the outer search is not hill-climbing through noise), and it is an
// upper bound on what the full solve will manage. An allocation the greedy
// pass can fill cleanly is an allocation worth keeping.

// `wanted` is what the search asked for and it is not the same thing: a step
// shorter than a diagonal needs is refused, a branch whose departure falls

// AN EVENT WHOSE OWN RAIL CHANGES LEVEL UNDERNEATH IT.
//
// Somebody else's step landing inside your event moves the rail between your
// dot and your tick, so the event is drawn beginning on one level and ending
// on another, and the reader has no way to know the climb is not part of it.

// the diagonal IS the event, which is the whole grammar.

  var n = 0;

    if (w.pill) return;

    if (Math.abs(mode) === 1) return;

// HOW FAR A TRUNK SPENDS THE DAY FROM WHERE IT BELONGS.
//
// MEASURED AND NOT CHARGED, and the attempt is left here with its result.
// Charged at anything that made two steps lose to one branch, it also made
// ONE step lose to no step: every rail on every board came out flat, which
// is the opposite of what was asked for. A step's whole nature is that it
// stays, so any price on staying is a price on stepping.

// A NAME WHOSE NEAREST MARK IS SOMEBODY ELSE'S.
//
// This is the fault behind "standup and quick sync deserve a shelf". Two

// and no arrangement of the words fixes it: the reader has to guess which
// name goes with which dot. The board is clean by every other test and is
// still asking a question it should be answering.
//
// ASKED THE WAY A READER ASKS IT. The first version guessed -- two events
// within some fraction of a caption's width, sitting at the same level --
// and both halves of that guess went wrong. The distance was arbitrary, so
// two dots thirty-nine pixels apart with plainly separate marks were called
// ambiguous. And the level test used a caption's HEIGHT, which happened to
// be exactly the depth a band could give a shelf, so the answer came down to
// the last decimal place of where a sloping trunk was: two arrangements that
// are the same picture scored 464 and 2664.

  if (!sol) return 0;

  spec.wants.forEach(function (w, i) {
    if (w.pill) return;
    var k = sol.pick[i];
    if (k == null || k < 0) return;                 // not drawn: nothing to mispair
    if (sol.cands[i][k].mud) { n++; if (who) who[i] = 1; }
  });
  return n;
}

// WHEN TWO EVENTS CROWD, IT IS THE EARLIER ONE THAT LEAVES THE TRUNK.
//

// the shelf for team standup though" -- and there is a reason for it worth
// writing down rather than treating as taste.
//
// The reader travels along a trunk in time order. Take the FIRST of a
// crowded pair off it and the trunk is already clear by the time the eye
// reaches the second, so the trunk's own next stop is unambiguous and the
// spur reads as a detour already taken. Take the SECOND off and the reader
