name: Tests

on:
  push:
    branches: ["**"]
  pull_request:
  # framework.yml starts a run on the branch it pushes: a push made with the
  # workflow's own token starts nothing by itself
  workflow_dispatch:

jobs:
  # the suites that need no browser (./test.sh node)
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: ./test.sh node

  # everything that renders the plugin or runs its transform, on trmnlp's own
  # test framework (`trmnlp test`, in the trmnl/trmnlp image tools/trmnl-test
  # pins): a summary on the run page, and the report with every screen drawn
  # as the "trmnl-report" artifact
  trmnl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # esbuild, for the squeezed copy the shipped spec tests
      - run: cd tools && npm ci --no-audit --no-fund
      - run: ./test.sh trmnl
        env:
          METRO_SHARDS: 4
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trmnl-report
          path: test/trmnl-report

  # A run framework.yml started is not a pull request's run, so the pull
  # request would show nothing of it (and GitHub holds the pull request's own
  # run of a workflow-made branch for approval). This puts the verdict on the
  # commit, where the pull request shows it.
  verdict:
    if: always() && github.event_name == 'workflow_dispatch'
    needs: [node, trmnl]
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          STATE: ${{ (needs.node.result == 'success' && needs.trmnl.result == 'success') && 'success' || 'failure' }}
        run: |
          gh api "repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -f state="$STATE" -f context="Tests (started by a workflow)" \
            -f description="node: ${{ needs.node.result }}, trmnl: ${{ needs.trmnl.result }}" \
            -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
