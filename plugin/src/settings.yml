---
id: 471753
strategy: polling
no_screen_padding: 'no'
dark_mode: 'no'
static_data: "{}"
polling_verb: get
framework_version: 3.3.1
serverless_language: node
polling_url: ''
polling_headers: ''
polling_body: ''
oauth_enabled: 'false'
oauth_pkce_enabled: 'no'
oauth_authorize_url: ''
oauth_token_url: ''
oauth_scopes: ''
oauth_scope_separator: ''
oauth_refresh_url: ''
oauth_auth_params: ''
oauth_token_headers: ''
oauth_token_site: ''
oauth_token_params: ''
oauth_token_request_auth_method: ''
oauth_body_format: ''
oauth_token_response_metadata: ''
oauth_authorization_method: ''
oauth_refresh_params: ''
oauth_token_field_name: ''
oauth_expiry_field_name: ''
oauth_expiry_strategy: ''
oauth_fixed_expiry_ms: ''
custom_fields:
- keyname: author_info
  name: About This Plugin
  field_type: author_bio
  description: 'Who is out, who is home, who is picking up the kids. One look at the wall and you know.<br /><br />A <strong>shared family calendar</strong> drawn as a metro map. Everyone in the household gets a <strong>line</strong>, their appointments are <strong>stops</strong> along it, and when two of you are at the same thing your lines meet at an <strong>interchange</strong> - so overlaps and clashes are something you see, rather than something you work out from a list.<br /><br />It shows today and rolls on into tomorrow as the evening runs out, with holidays and the weather in the header. It reads any calendar that gives you a link - Google, Apple, Outlook, Nextcloud - speaks eight languages, and fits every TRMNL screen and mashup.<br /><br /><strong>Try it before you set anything up.</strong> With no calendars added it draws a full example day, so you can see whether this is how you want your week to look.<br /><br />Then yes - it wants your calendars, and that is a cup of tea''s worth of work. The <strong>setup helper</strong> does it with you rather than sending you off to find things alone: it asks who is in the house, shows you where the calendar link hides in Google, Apple, Outlook, Nextcloud or Proton, reads each one back to you in words to prove it works, and draws the finished board before you save anything. It can also write you a prompt for an AI assistant: paste it in, paste the answer back, and your own board reads like the examples, with the lines named, a mixed feed routed to the right people and the titles trimmed. Do it once and the wall looks after itself.'
  github_url: https://github.com/ExcuseMi/trmnl-metro-calendar-plugin
  learn_more_url: https://excusemi.github.io/trmnl-metro-calendar-plugin/tools/config-editor.html
  category: calendar
  help_text: TRMNL X Ready · English, français, español, Deutsch, Nederlands, italiano, português, polski
- keyname: setup_mode
  field_type: select
  name: Set Up With
  description: A list of calendars is enough for most households. The setup helper is for routing one shared feed to several people by rules, and the rest.
  options:
  - A list of calendars: links
  - A configuration from the setup helper: config
  default: links
  optional: true
  conditional_validation:
  - when: links
    hidden:
    - config_json
  - when: config
    hidden:
    - calendar_list
- keyname: calendar_list
  field_type: text
  name: Calendars
  placeholder: |-
    Alex  https://calendar.google.com/calendar/ical/.../basic.ics
    Sam   https://outlook.live.com/owa/calendar/.../calendar.ics
    Sam   webcal://p12-caldav.icloud.com/published/2/...
          https://calendar.example.com/family.ics
    https://calendar.google.com/calendar/ical/en.be%23holiday%40group.v.calendar.google.com/public/basic.ics holiday
  description: 'One calendar per row: a name, then its link. The name is the line it goes on; the same name on two rows puts both calendars on one line. A link with no name is the whole household''s. Google''s public-holiday calendars are known on sight; for another provider''s, add <code>holiday</code> after the link. Leave it empty to see an example day.'
  optional: true
- keyname: config_json
  field_type: text
  name: Configuration
  placeholder: |-
    {
      "version": 1,
      "docs": "https://raw.githubusercontent.com/ExcuseMi/trmnl-metro-calendar-plugin/main/CONFIG.md",
      "lines": [{ "name": "Alex" }, { "name": "Sam" }],
      "calendars": [
        { "url": "https://calendar.example.com/alex.ics", "line": "Alex" },
        { "url": "https://calendar.example.com/sam.ics", "line": "Sam" }
      ]
    }
  description: 'Paste the configuration from the <a href="https://excusemi.github.io/trmnl-metro-calendar-plugin/tools/config-editor.html" target="_blank">setup helper</a>. It asks who lives with you and where each calendar is, checks every link, shows you the map, and gives you the text for this box. Its <strong>AI prompt</strong> gets you a board like the examples fastest: paste the prompt into an assistant, paste the answer back. Leave it empty to see an example day.'
  optional: true
- keyname: time_format
  field_type: select
  name: Time Format
  description: Auto uses the usual clock for your TRMNL account language.
  options:
  - Auto: auto
  - 24-hour: 24h
  - 12-hour: 12h
  default: auto
  optional: true
- keyname: lat_lon
  field_type: lat_lon
  name: Location
  group: Weather
  description: For the weather in the header, and small icons along the hours when rain starts or stops. Leave it empty for no weather.
  optional: true
- keyname: temperature_unit
  field_type: select
  name: Temperature Unit
  group: Weather
  description: Which unit the forecast is shown in.
  options:
  - Celsius: c
  - Fahrenheit: f
  default: c
  optional: true
- keyname: alert_enabled
  field_type: boolean
  name: Weather Alert Banner
  group: Weather
  description: A banner along the bottom when rain, snow, thunderstorms, frost or heat is on the way, saying when. Needs a <strong>Location</strong>. On a calm day it takes no space.
  default: false
  optional: true
  conditional_validation:
  - when: 'false'
    hidden:
    - alert_rain_threshold
    - alert_temp_low
    - alert_temp_high
- keyname: alert_rain_threshold
  field_type: number
  name: Rain Chance At Or Above (%)
  group: Weather
  description: 70 is a good "take a coat" line. Leave it empty for no rain alert. Snow and thunderstorms always alert.
  placeholder: '70'
  default: 70
  optional: true
- keyname: alert_temp_low
  field_type: number
  name: Cold At Or Below
  group: Weather
  description: "In the unit above. Leave it empty to be warned at freezing, 0°C / 32°F. For hard frost only, try -10°C / 14°F."
  optional: true
- keyname: alert_temp_high
  field_type: number
  name: Heat At Or Above
  group: Weather
  description: "In the unit above. Leave it empty to be warned at 30°C / 86°F. For heatwaves only, try 35°C / 95°F."
  optional: true
- keyname: news_feeds
  field_type: text
  group: News
  name: News Feeds
  placeholder: |-
    https://www.vrt.be/vrtnws/nl.rss.articles.xml
    https://www.example-school.be/news/feed
  description: 'Headlines along the foot of the map, like the platform display under a departure board. One RSS or Atom link per row: the local paper, the school, the club. Leave it empty for none.'
  optional: true
- keyname: news_count
  field_type: select
  group: News
  name: Headlines
  description: How many rows the news may take on a full panel. A small panel shows one.
  options:
  - One: 1
  - Two: 2
  - Three: 3
  - Four: 4
  default: 3
  optional: true
- keyname: demo_set
  field_type: select
  name: Example Day
  group: Example
  description: Which example the board shows while <strong>Calendars</strong> is empty. Each is a real setup from the <a href="https://github.com/ExcuseMi/trmnl-metro-calendar-plugin/tree/main/demo" target="_blank">demo folder</a>, so you can copy the one you like.
  options:
  - Springfield, a family of five: simpsons
  - Planet Express, a work crew: futurama
  - Apartment 20, two flatmates: friends
  default: simpsons
  optional: true
- keyname: use_demo_data
  field_type: boolean
  name: Show The Example Anyway
  group: Example
  description: Keeps the example on screen even with calendars filled in. Handy for trying out the plugin without showing your own week.
  default: false
  optional: true
name: Metro Calendar
description: Shared family calendar & schedule
refresh_interval: 15
